[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omenrgb"
version = "0.1.0"
description = "Background service for the HP OMEN 45L cooler LCD and case lights"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
# Pillow and PyGObject come from the system (the venv uses --system-site-packages).
dependencies = ["openrgb-python==0.3.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["omenrgb"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:gi.overrides"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, modern syntax.
select = ["E", "F", "I", "B", "UP"]
